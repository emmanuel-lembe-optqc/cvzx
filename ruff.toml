line-length = 119
include = ["**/*.py", "**/pyproject.toml"]
exclude = [
    "tests/**",                  # exclude test files from linting
    "**/*.ipynb",                # exclude Jupyter notebooks from linting
    "**/pb/mqc3_cloud/**/*.py",  # exclude protobuf generated files
    "**/pb/mqc3_cloud/**/*.pyi", # exclude protobuf generated files
    "**/.ipynb_checkpoints/**",  # exclude Jupyter checkpoints
    "docs/**",                   # Sphinx config/build output, not part of the cvzx package
]
preview = true
target-version = "py312"

[lint]
select = ["ALL"]
ignore = [
    "COM812",  # missing-trailing-comma
    "CPY001",  # missing-copyright-notice
    "D104",    # undocumented-public-package
    "D401",    # non-imperative-mood (excluded by the "google" convention this project used before;
               # kept off now that "numpy" enables it, since many docstrings here lead with a noun
               # phrase describing the value/state rather than an imperative verb)
    "ERA001",  # commented-out-code
    "FA102",   # future-required-type-annotation
    "FIX002",  # line-contains-todo
    "ISC001",  # single-line-implicit-string-concatenation
    "N802",    # invalid-function-name
    "PLR6301", # no-self-use
    "S311",    # suspicious-non-cryptographic-random-usage
    "TD002",   # missing-todo-author
    "TD003",   # missing-todo-link
    "PLR0904", # too-many-public-methods
]

[lint.pydocstyle]
convention = "numpy"